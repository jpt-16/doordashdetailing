<title>DetailDash Store App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..800&display=swap">
<style>
/* Layout: three realistic phones on a soft blue glow, as in a shop-app showcase: line-up list, home in the middle, detail on the right. Each phone is a live app with its own navigation. */
:root{--bg:#f3f8ff;--fg:#1d1d1f;--muted:#6e6e73;--glow:#b9d8ff;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Hanken Grotesk",system-ui,sans-serif}

:root[data-theme="dark"]{--bg:#070d18;--fg:#f5f5f7;--muted:#9aa3b2;--glow:#143a6b;color-scheme:dark}
*{box-sizing:border-box}h1,h2,h3,p{margin:0}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(70% 55% at 50% 52%,var(--glow),transparent 70%),var(--bg);color:var(--fg);font:500 15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{max-width:900px;margin:0 auto 26px;text-align:center}
.head h1{font-size:clamp(1.8rem,4.6vw,2.8rem);letter-spacing:-.035em;line-height:1.05;font-weight:800;text-wrap:balance}
.head p{color:var(--muted);margin:10px auto 0;max-width:56ch}
.show{display:flex;justify-content:center;align-items:center;gap:clamp(10px,3vw,36px);max-width:1240px;margin:0 auto}
.show .dev.s{zoom:.82}

.isl{position:absolute;top:10px;left:50%;translate:-50% 0;width:112px;height:32px;border-radius:20px;background:#000;z-index:60}

.nav{position:absolute;inset:0;overflow:hidden}
.pg{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:#fff;scrollbar-width:none;overscroll-behavior:contain;padding:56px 0 100px;will-change:transform}

.pg.top{box-shadow:-10px 0 30px rgba(0,0,0,.14)}
.tbar{position:absolute;inset:auto 0 0;z-index:40;display:flex;justify-content:space-around;padding:8px 6px 24px;background:rgba(255,255,255,.78);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-top:.5px solid rgba(0,0,0,.12)}
.tbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;font-weight:600;color:#7a7a80;min-width:68px;min-height:46px;padding-top:3px;transition:transform .12s}

.hbar{position:absolute;bottom:7px;left:50%;translate:-50% 0;width:136px;height:5px;border-radius:3px;background:#000;z-index:70;pointer-events:none}

/* common */
.row{display:flex;align-items:center}
.top-r{display:flex;align-items:center;gap:6px;padding:4px 16px 10px}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#0071e3,#7ab8ff);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:800}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;transition:background .15s,transform .12s}

.h2{font-size:1.25rem;font-weight:800;letter-spacing:-.025em;padding:20px 16px 10px;display:flex;justify-content:space-between;align-items:baseline}

.ban .art{position:absolute;right:-10px;bottom:-4px;width:76%}
.dots{position:absolute;left:50%;bottom:8px;translate:-50% 0;display:flex;gap:5px;z-index:2}

.cd{background:#f5f5f7;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:transform .15s}

.rl{margin:0 14px;border-radius:18px;background:#0b1530;color:#fff;height:150px;position:relative;overflow:hidden;text-align:left;width:calc(100% - 28px);display:block}
.rl b{position:absolute;left:16px;top:14px;font-size:.95rem;max-width:11ch;line-height:1.2;z-index:2}

.rl svg{position:absolute;right:-6px;bottom:-14px;width:68%}
.rl::before{content:"";position:absolute;right:-20%;top:-40%;width:90%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(0,113,227,.7),transparent 65%)}

.tt{display:flex;justify-content:space-between;align-items:baseline;padding:8px 16px 10px}
.tt h2{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}

.dt{padding:14px 16px 0}
.dt h1{font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.dt p{font-size:.8rem;color:#515154;margin-top:6px;line-height:1.45}
.dt p a{color:#0071e3;font-weight:600}
.lb{padding:14px 16px 8px;font-size:.84rem;font-weight:700}
.chs{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px}
.ch{border:1.5px solid #d6d6db;border-radius:999px;min-height:34px;padding:0 14px;font-size:.78rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;background:#fff;transition:transform .12s,border-color .15s,background .15s}
.ch:active{transform:scale(.95)}
.ch[aria-pressed="true"]{border-color:#0071e3;background:#eaf3ff;color:#0058b0}
.inf{margin:14px 16px 0;border-radius:14px;background:#f5f5f7;padding:12px 14px;font-size:.78rem;color:#515154;display:flex;gap:10px;align-items:flex-start}
.inf b{color:#1d1d1f;display:block;font-size:.84rem}
.buy{position:sticky;bottom:0;margin-top:20px;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:.5px solid rgba(0,0,0,.1)}

.li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:.5px solid #ececef;text-align:left;width:100%}
.li .th{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;flex:none;overflow:hidden}
.li .th svg{width:92%}
.li .i{flex:1;min-width:0}.li b{display:block;font-size:.9rem}.li span.s{font-size:.76rem;color:#6e6e73;display:block}
/* sheet */
.ovl{position:absolute;inset:0;z-index:80;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:auto}
.sh{position:absolute;inset:auto 0 0;background:#fff;border-radius:26px 26px 0 0;padding:0 0 28px;pointer-events:auto;will-change:transform;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
.gr{padding:10px 0 8px;display:grid;place-items:center;touch-action:none;cursor:grab}
.gr i{width:38px;height:5px;border-radius:3px;background:#d4d4d9}
.sh h3{font-size:1.1rem;font-weight:800;letter-spacing:-.02em;text-align:center;padding-bottom:6px}
.sr{display:flex;justify-content:space-between;gap:12px;padding:11px 18px;font-size:.84rem;border-top:.5px solid #ececef}
.sr span:first-child{color:#6e6e73}.sr b{text-align:right}
.sh .chs{padding:6px 16px 10px}
.sh .pill{width:calc(100% - 32px);margin:12px 16px 0;justify-content:center}
.ok{display:grid;place-items:center;padding:18px 20px 6px;text-align:center;gap:6px}
.ok svg{width:64px;height:64px}
.ok circle{fill:#0071e3}
.ok path{stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:ck .5s .15s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes ck{to{stroke-dashoffset:0}}
.fade{animation:fd .22s ease-out both}@keyframes fd{from{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
