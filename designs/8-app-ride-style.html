<title>DetailDash App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap">
<style>
/* Layout: page shows one interactive phone plus a screen list, or a board of every screen. Inside the phone: ride-hailing app patterns. White, black, gray tiles, map plus bottom sheet, black primary button. */
:root{--bg:#eceef1;--panel:#fff;--fg:#0a0a0a;--muted:#5c6470;--line:#d9dde3;--btn:#0a0a0a;--on-btn:#fff;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f12;--panel:#171a1f;--fg:#f2f4f7;--muted:#97a0ad;--line:#2a2f37;--btn:#f2f4f7;--on-btn:#0a0a0a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f12;--panel:#171a1f;--fg:#f2f4f7;--muted:#97a0ad;--line:#2a2f37;--btn:#f2f4f7;--on-btn:#0a0a0a;color-scheme:dark}
*{box-sizing:border-box}h1,h2,h3,p{margin:0}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:500 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid #276ef1;outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.top{display:flex;flex-wrap:wrap;gap:14px 24px;justify-content:space-between;align-items:flex-end}
.top h1{font-size:clamp(1.7rem,4.4vw,2.6rem);letter-spacing:-.035em;line-height:1.05;font-weight:800}
.top p{color:var(--muted);margin-top:8px;max-width:48ch}
.ctl{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:8px 14px;border-radius:9px;font-weight:700;font-size:.88rem;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.stage{display:grid;grid-template-columns:minmax(0,392px) minmax(0,1fr);gap:40px;align-items:start}
@media(max-width:860px){.stage{grid-template-columns:minmax(0,1fr);justify-items:center}.side{width:100%}}
.side{display:flex;flex-direction:column;gap:16px;min-width:0;width:100%}
.side h2{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:10px}
.jump{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.jump button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;min-height:54px;display:flex;flex-direction:column}
.jump button small{color:var(--muted);font-weight:500;font-size:.76rem}
.jump button[aria-current="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.jump button:active{transform:scale(.98)}
.note{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.note b{display:block;font-size:1.05rem;letter-spacing:-.02em;margin-bottom:6px}
.note p{color:var(--muted)}
.board{display:flex;gap:26px;overflow-x:auto;padding:6px 4px 20px;scroll-snap-type:x proximity}
.board>figure{margin:0;flex:none;scroll-snap-align:start}
.board figcaption{font-weight:800;margin-top:10px;font-size:.9rem}
.bw{width:calc(392px*.62);height:calc(820px*.62);position:relative}
.bw .device{zoom:.62;position:absolute;left:0;top:0;width:392px}
.bw .device{pointer-events:none}

/* device */
.device{width:min(392px,100%);background:#0a0a0a;border-radius:56px;padding:11px;box-shadow:0 30px 60px -22px rgba(0,0,0,.5)}
.phone{--ph:798px;position:relative;height:var(--ph);border-radius:45px;overflow:hidden;background:#fff;color:#0a0a0a;isolation:isolate;display:flex;flex-direction:column;font-family:var(--sans)}
.isl{position:absolute;top:11px;left:50%;translate:-50% 0;width:108px;height:31px;border-radius:20px;background:#000;z-index:50}
.sb{position:absolute;inset:0 0 auto;height:54px;padding:18px 32px 0;display:flex;justify-content:space-between;font-weight:700;font-size:.95rem;z-index:40;pointer-events:none}
.sc{flex:1;overflow-y:auto;padding-top:54px;scrollbar-width:none;overscroll-behavior:contain;display:flex;flex-direction:column}
.sc::-webkit-scrollbar{display:none}
.hbar{position:absolute;bottom:7px;left:50%;translate:-50% 0;width:134px;height:5px;border-radius:3px;background:#0a0a0a;z-index:45;pointer-events:none}
.tabs{display:flex;border-bottom:1px solid #e6e6e6;position:relative}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:1.02rem;padding:12px 0 14px;min-height:50px;color:#0a0a0a;position:relative}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:#0a0a0a}
.tabs button[disabled]{color:#8c8c8c}
.soon{font-size:.62rem;font-weight:800;background:#e8e8e8;border-radius:5px;padding:2px 6px;letter-spacing:.04em;text-transform:uppercase;color:#444}
.where{margin:16px 16px 0;display:flex;align-items:center;gap:10px;background:#eee;border-radius:12px;min-height:52px;padding:0 8px 0 14px;font-weight:700;font-size:1.12rem;text-align:left;width:calc(100% - 32px);transition:background .12s,transform .1s}
.where:active{background:#e0e0e0;transform:scale(.99)}
.where .g{flex:1;color:#222}
.now{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:0 12px;min-height:34px;font-size:.88rem;font-weight:700}
.rec{display:flex;align-items:center;gap:14px;padding:12px 16px;width:100%;text-align:left;min-height:62px}
.rec .ci{width:34px;height:34px;border-radius:50%;background:#eee;display:grid;place-items:center;flex:none}
.rec b{display:block;font-size:1rem}.rec span{color:#6b6b6b;font-size:.88rem}
.rec:active{background:#f4f4f4}
.sh{display:flex;justify-content:space-between;align-items:baseline;padding:20px 16px 12px}
.sh h2{font-size:1.14rem;font-weight:700;letter-spacing:-.01em}.sh a,.sh button{font-size:.88rem;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px}
.tile{position:relative;background:#f3f3f3;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:8px 2px 10px;min-height:92px;font-size:.78rem;font-weight:600;transition:transform .1s,background .12s}
.tile:active{transform:scale(.95);background:#e6e6e6}
.tile svg{width:46px;height:46px}
.promo-b{position:absolute;top:-9px;left:50%;translate:-50% 0;background:#0e8345;color:#fff;font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:5px}
.banner{margin:18px 16px 0;border-radius:14px;background:#0a0a0a;color:#fff;padding:18px;min-height:118px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;text-align:left;width:calc(100% - 32px)}
.banner b{font-size:1.05rem;max-width:14ch;line-height:1.2;position:relative;z-index:1;display:block}
.banner span{font-size:.84rem;font-weight:700;position:relative;z-index:1}
.banner svg{position:absolute;right:-12px;top:-12px;width:190px;opacity:.95}
.tb{display:flex;justify-content:space-around;padding:8px 6px 26px;border-top:1px solid #e6e6e6;background:#fff;position:relative;z-index:30}
.tb button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:#7d7d7d;min-width:68px;min-height:46px;padding-top:4px}
.tb button[aria-current="page"]{color:#0a0a0a;font-weight:700}
.tb button:active{transform:scale(.94)}
.dot{position:relative}.dot::after{content:"";position:absolute;top:-1px;right:-3px;width:8px;height:8px;border-radius:50%;background:#276ef1;border:2px solid #fff}
.h1{font-size:2rem;letter-spacing:-.035em;font-weight:800;padding:8px 16px 14px;line-height:1.1}
.h3{font-size:1.2rem;font-weight:700;padding:14px 16px 12px;letter-spacing:-.015em}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.sep{height:8px;background:#f1f1f1;margin-top:20px}

/* map + sheet */
.mapw{position:relative;flex:none;height:300px;background:#e9ebee}
.mapw svg.map{position:absolute;inset:0;width:100%;height:100%}
.rnd{position:absolute;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);display:grid;place-items:center;z-index:5}
.rnd:active{transform:scale(.92)}
.addr{position:absolute;background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.2);padding:7px 10px;font-size:.84rem;font-weight:700;display:flex;gap:6px;align-items:center;z-index:5;max-width:210px;white-space:nowrap}
.addr i{width:8px;height:8px;background:#0a0a0a;flex:none}.addr i.c{border-radius:50%}
.addr em{font-style:normal;background:#0a0a0a;color:#fff;border-radius:4px;padding:1px 6px;font-size:.7rem}
.sheet{flex:1;background:#fff;border-radius:18px 18px 0 0;margin-top:-18px;position:relative;z-index:6;display:flex;flex-direction:column;box-shadow:0 -4px 16px rgba(0,0,0,.08);min-height:0}
.sheet .ttl{text-align:center;font-weight:700;padding:14px 0 12px;font-size:1.02rem;border-bottom:1px solid #eee}
.svcs{display:flex;gap:8px;padding:12px 16px 10px;overflow-x:auto;scrollbar-width:none}
.svcs::-webkit-scrollbar{display:none}
.sv{flex:none;border-radius:999px;background:#eee;font-weight:700;font-size:.86rem;padding:0 14px;min-height:36px;transition:transform .1s}
.sv:active{transform:scale(.95)}
.sv[aria-pressed="true"]{background:#0a0a0a;color:#fff}
.list{flex:1;overflow-y:auto;scrollbar-width:none;padding:2px 10px}
.list::-webkit-scrollbar{display:none}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px 10px 4px;border-radius:12px;border:2px solid transparent;min-height:78px;transition:transform .1s}
.opt:active{transform:scale(.99)}
.opt[aria-checked="true"]{border-color:#0a0a0a}
.opt .van{width:78px;flex:none}
.opt .mid{flex:1;min-width:0}
.opt .nm{font-weight:700;font-size:1.04rem;display:flex;align-items:center;gap:6px;white-space:nowrap}
.opt .nm span.t{overflow:hidden;text-overflow:ellipsis}
.opt .sb2{font-size:.8rem;color:#5e5e5e;margin-top:1px;white-space:nowrap}
.opt .pr{font-weight:700;font-size:1.04rem;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:3px;background:#276ef1;color:#fff;border-radius:4px;font-size:.66rem;font-weight:700;padding:1px 5px;margin-top:3px}
.tag.g{background:#e6e6e6;color:#222}
.foot{border-top:1px solid #eee;padding:10px 16px 28px;background:#fff}
.pay{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0 12px;font-weight:700;text-align:left}
.pay span.cc{width:30px;height:20px;border-radius:4px;background:#1a1f71;display:grid;place-items:center;color:#fff;font-size:.55rem;font-weight:800;font-style:italic}
.pay .a{margin-left:auto;color:#6b6b6b}
.fr{display:flex;gap:10px}
.cta{flex:1;background:#0a0a0a;color:#fff;border-radius:10px;min-height:54px;font-weight:700;font-size:1.04rem;transition:transform .1s,background .15s}
.cta:active{transform:scale(.98);background:#2a2a2a}
.cta.w{background:#eee;color:#0a0a0a}
.sq{width:54px;min-height:54px;border-radius:10px;background:#eee;display:grid;place-items:center;flex:none}
.sq:active{transform:scale(.94)}

/* confirmed */
.row2{display:flex;gap:14px;padding:14px 16px;align-items:flex-start;border-top:1px solid #eee}
.row2 .ic{width:40px;height:40px;border-radius:50%;background:#eee;display:grid;place-items:center;flex:none}
.row2 b{display:block}.row2 span{color:#5e5e5e;font-size:.9rem}
.card{margin:0 16px;border:1px solid #e3e3e3;border-radius:14px;overflow:hidden}
.card .mapw{height:150px;margin-top:0}
.stp{display:flex;flex-direction:column;padding:6px 16px}
.stp div{display:flex;gap:14px;align-items:flex-start;padding-bottom:16px;position:relative}
.stp div::before{content:"";position:absolute;left:8.5px;top:20px;bottom:0;width:2px;background:#e3e3e3}
.stp div:last-child::before{display:none}
.stp i{width:18px;height:18px;border-radius:50%;border:2px solid #cfcfcf;background:#fff;flex:none;margin-top:2px}
.stp .d i{background:#0a0a0a;border-color:#0a0a0a}
.stp .n i{border-color:#0a0a0a;box-shadow:0 0 0 4px #e6e6e6}
.stp .p{color:#8a8a8a}
.stp b{display:block;font-size:.98rem}.stp span{font-size:.84rem;color:#6b6b6b}
.act{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #eee;width:100%;text-align:left}
.act .th{width:56px;height:56px;border-radius:10px;background:#f3f3f3;display:grid;place-items:center;flex:none}
.act .i{flex:1;min-width:0}.act b{display:block}.act span{color:#6b6b6b;font-size:.86rem;display:block}
.rb{background:#eee;border-radius:999px;font-weight:700;font-size:.84rem;min-height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
.rb:active{transform:scale(.95)}
/* pro */
.bigt{display:flex;align-items:center;gap:12px;background:#0a0a0a;color:#fff;border-radius:999px;min-height:50px;padding:0 8px 0 20px;font-weight:700;position:absolute;left:50%;translate:-50% 0;bottom:14px;z-index:6}
.sw2{width:48px;height:30px;border-radius:15px;background:#3a3a3a;position:relative;transition:background .2s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.sw2.on{background:#06c167}.sw2.on::after{transform:translateX(18px)}
.earn{position:absolute;left:50%;translate:-50% 0;top:62px;z-index:6;background:#0a0a0a;color:#fff;border-radius:999px;padding:8px 18px;font-weight:800;font-size:1.3rem;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.offer{background:#fff;padding:16px 16px 28px;border-radius:18px 18px 0 0;margin-top:-18px;position:relative;z-index:6;box-shadow:0 -4px 16px rgba(0,0,0,.1)}
.cd{height:5px;border-radius:3px;background:#eee;overflow:hidden;margin-bottom:14px}
.cd i{display:block;height:100%;background:#0a0a0a;width:100%;animation:cd 15s linear forwards}
@keyframes cd{to{width:0}}
.big{font-size:2.3rem;font-weight:800;letter-spacing:-.04em}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding:0 16px}
.bars i{flex:1;background:#e3e3e3;border-radius:5px 5px 2px 2px}.bars i.c{background:#0a0a0a}
.tst{position:absolute;left:14px;right:14px;bottom:100px;z-index:60;background:#0a0a0a;color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;animation:up .25s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
 <header class="top">
  <div><h1>DetailDash app</h1><p>Mobile screens in a ride-hailing style: search first, map and bottom sheet, one black button. Tap through the phone or view every screen at once.</p></div>
  <div class="ctl"><div class="seg" id="roles" role="group" aria-label="App"></div><div class="seg" id="views" role="group" aria-label="View"></div></div>
 </header>
 <div id="out"></div>
</div>
